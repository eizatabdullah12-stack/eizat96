name: Build offline Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fetch_models.py'
      - 'export_glossary.py'
      - 'collect_notices.py'
      - 'create_assets.py'
      - 'PORTABLE_README.txt'
      - 'TERMINOLOGY.md'
      - 'LICENSE'
      - 'requirements.txt'
      - 'build_windows.ps1'
      - 'installer.iss'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fetch_models.py'
      - 'export_glossary.py'
      - 'collect_notices.py'
      - 'create_assets.py'
      - 'PORTABLE_README.txt'
      - 'TERMINOLOGY.md'
      - 'LICENSE'
      - 'requirements.txt'
      - 'build_windows.ps1'
      - 'installer.iss'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EngineeringTranslator-1.12-Setup
          path: installer_output/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reuse the verified Windows installer
        run: gh run download "$GITHUB_RUN_ID" --name EngineeringTranslator-1.12-Setup --dir artifact
      - name: Record installer identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          installer=Path('artifact/EngineeringTranslator-1.12-Setup.exe')
          with installer.open('rb') as f:
              digest=hashlib.file_digest(f,'sha256').hexdigest()
          Path('release-notes.md').write_text('Download and run EngineeringTranslator-1.12-Setup.exe on Windows. No build or GitHub sign-in needed.\n\nCreated by Eizat. New speech-bubble E logo in the app, Windows executable, and installer.\n\nCorrects Belgian Dutch architectural labels and abbreviations, including vloerpas, onderz fund, polierbeton, potten en balken, raamborderel and tilt-and-turn windows. Recorded phrases survive abbreviation dots such as cfr. Wrapped incomplete glossary labels are joined only across nearby aligned PDF lines. Existing conversation mode, four languages, offline models, protected values and engineering workflow are retained.\n\nAll regression tests, compiled app checks with all six models, and Windows installation/file checks passed before publication.\n\nInstaller SHA-256: '+digest+'\n',encoding='utf-8')
          print('Installer SHA-256:',digest)
          print('Installer bytes:',installer.stat().st_size)
      - name: Publish Windows download
        run: gh release create v1.12 artifact/EngineeringTranslator-1.12-Setup.exe --target "$GITHUB_SHA" --title "Eizat Offline Translator 1.12" --notes-file release-notes.md
