name: Build portable Windows translator
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fetch_models.py'
      - 'export_glossary.py'
      - 'collect_notices.py'
      - 'PORTABLE_README.txt'
      - 'TERMINOLOGY.md'
      - 'LICENSE'
      - 'requirements.txt'
      - 'build_windows.ps1'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fetch_models.py'
      - 'export_glossary.py'
      - 'collect_notices.py'
      - 'PORTABLE_README.txt'
      - 'TERMINOLOGY.md'
      - 'LICENSE'
      - 'requirements.txt'
      - 'build_windows.ps1'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EngineeringPDFTranslator-1.3-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
